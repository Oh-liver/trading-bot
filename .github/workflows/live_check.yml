name: Live Trading Bot Check

# Spúšťa sa automaticky podľa harmonogramu ("cron") a dá sa spustiť
# aj ručne cez tlačidlo "Run workflow" v záložke Actions na GitHube.
on:
  schedule:
    - cron: "0 * * * *"   # každú celú hodinu (pozor: čas je v UTC, nie slovenský čas!)
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Poslať testovaciu Discord správu (bez ohľadu na to, či nastal BUY/SELL signál)"
        type: boolean
        default: false

# Potrebné, aby workflow smel commitnúť zmenený stav bota späť do repa
permissions:
  contents: write

# Zabráni tomu, aby bežali dva behy naraz (napr. hodinový cron + manuálny test)
# a navzájom si kolidovali pri pushnutí zmeneného state/ - druhý beh počká.
concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      # Manuálne otestovanie Discord webhooku priamo z GitHub Actions - zaškrtni
      # "test_notification" pri "Run workflow", aby si overil, že DISCORD_WEBHOOK_URL
      # secret je nastavený správne, bez čakania na skutočný BUY/SELL signál.
      - name: Testovacia Discord notifikácia
        if: ${{ github.event.inputs.test_notification == 'true' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "from notify import send_discord_notification; ok = send_discord_notification('Test notifikacia z GitHub Actions: ak vidis tuto spravu, secret DISCORD_WEBHOOK_URL je nastaveny spravne.'); print('sent:', ok)"

      # Watchlist (viac tickerov naraz, každý s vlastnou peňažnou alokáciou)
      # sa upravuje priamo vo watchlist.json - pozri README.
      # DISCORD_WEBHOOK_URL: nastav ako GitHub secret (Settings -> Secrets and
      # variables -> Actions), ak chceš pri BUY/SELL signáli dostať upozornenie
      # na Discord. Bez neho beží bot ďalej, len bez notifikácií.
      #
      # T212_LIVE_TRADING / T212_API_KEY / T212_API_SECRET / T212_ENV: voliteľné
      # GitHub secrets na zapnutie SKUTOČNÉHO obchodovania cez Trading212 - viď
      # README. Bez T212_LIVE_TRADING=true bot obchoduje len virtuálne (paper),
      # presne ako doteraz. POZOR: GitHub Actions runnery bežia z premenlivých
      # IP adries - IP-whitelist na Trading212 API kľúči tu nepoužívaj.
      - name: Live kontrola - watchlist (všetky tickery)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          T212_LIVE_TRADING: ${{ secrets.T212_LIVE_TRADING }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_ENV: ${{ secrets.T212_ENV }}
        run: python live_runner.py --watchlist watchlist.json

      # Zmenený priečinok state/ (stav portfólia + log obchodov) sa commitne
      # späť do repozitára, aby si ho videl aj v appke a aby na neho nadviazal
      # ďalší beh o hodinu neskôr.
      - name: Commit aktualizovaného stavu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Live bot check - aktualizácia stavu"
          file_pattern: "state/*"